<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#211c3f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Little Words"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>Little Words — английский A1/A2</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#131226;color:#f6f2ff;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:570px;margin:auto;padding:30px 20px 80px}.muted{color:#b5accd}.tag{color:#bdb0ff;font-weight:700}h1{font-size:32px;margin:10px 0 4px}button,input,select{font:inherit}button{cursor:pointer;background:#8a71f3;border:0;border-radius:16px;padding:14px 18px;color:white;font-weight:650}button.secondary{background:#2e2b4b}button:disabled{opacity:.4}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}select,input{background:#292641;border:1px solid #4a446b;border-radius:12px;padding:12px;color:white;min-width:0}.card{background:linear-gradient(155deg,#38305e,#282441);border:1px solid #65598e;min-height:290px;border-radius:26px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:28px;box-shadow:0 18px 60px #0004}.word{font-size:40px;font-weight:750;overflow-wrap:anywhere}.meaning{font-size:23px}.trans{color:#d4cafa}.example{font-style:italic;color:#d2c9e6}.actions{display:flex;gap:10px;margin-top:18px}.actions button{flex:1}.small{font-size:13px}.status{margin:15px 0 25px;color:#cfc6e2}.form{display:grid;gap:9px;margin-top:30px}.form input{width:100%}.hidden{display:none}hr{border:0;border-top:1px solid #363151;margin:32px 0}#result{min-height:24px;margin-top:12px;color:#d3c8ff}</style></head><body><main><div class="tag">✦ LITTLE WORDS</div><h1>Английский по карточкам</h1><div class="muted">A1 / A2 · Свой темп · Каждый день</div><div class="controls"><select id="level"><option value="all">Все уровни</option><option>A1</option><option>A2</option><option value="saved">Мои слова</option></select><select id="mode"><option value="all">Все карточки</option><option value="review">На повторение</option></select><button class="secondary" id="shuffle">Перемешать</button></div><div class="status" id="status"></div><div class="card" id="card" role="button" tabindex="0"><div class="tag" id="wordLevel"></div><div class="word" id="word"></div><div id="hiddenPart" class="hidden"><div class="trans" id="pronunciation"></div><div class="meaning" id="meaning"></div><div class="example" id="example"></div></div><div id="hint" class="muted small">Нажми на карточку, чтобы увидеть перевод</div></div><div class="actions"><button id="show" class="secondary">Показать перевод</button><button id="speak" class="secondary">🔊</button></div><div class="actions"><button id="repeat" class="secondary">🔁 Повторить</button><button id="know">✓ Знаю</button></div><div id="result"></div><hr><h2>Добавить своё слово</h2><form id="add" class="form"><input required id="newWord" placeholder="Слово по-английски"><input required id="newMeaning" placeholder="Перевод"><input id="newPronunciation" placeholder="Произношение русскими буквами"><input id="newExample" placeholder="Пример предложения"><button>Добавить карточку</button></form><p class="muted small">Прогресс сохраняется на этом устройстве. Для работы офлайн сначала открой приложение с интернетом. Для озвучки может понадобиться системный голос.</p></main><script>const base=[["apple","яблоко","эпл","I eat an apple.","A1"],["book","книга","бук","This book is new.","A1"],["house","дом","хаус","My house is small.","A1"],["work","работа; работать","уорк","I work every day.","A1"],["friend","друг","френд","She is my friend.","A1"],["water","вода","уотэ","Drink some water.","A1"],["morning","утро","монинг","Good morning!","A1"],["evening","вечер","ивнинг","See you this evening.","A1"],["learn","учить","лён","I learn English.","A1"],["understand","понимать","андэстэнд","I understand you.","A1"],["speak","говорить","спик","I speak English.","A1"],["listen","слушать","лисэн","Listen to me.","A1"],["write","писать","райт","Write your name.","A1"],["read","читать","рид","I read a book.","A1"],["ask","спрашивать","аск","Can I ask a question?","A1"],["answer","отвечать","ансэ","Please answer me.","A1"],["today","сегодня","тудэй","Today is Monday.","A1"],["tomorrow","завтра","тумороу","See you tomorrow.","A1"],["yesterday","вчера","естэдэй","I worked yesterday.","A1"],["always","всегда","олуэйз","I always study.","A1"],["sometimes","иногда","самтаймз","I sometimes cook.","A1"],["never","никогда","нэвэ","I never eat meat.","A1"],["because","потому что","бикоз","I stayed because it rained.","A1"],["before","до; перед","бифо","Call me before lunch.","A1"],["after","после","афтэ","See you after work.","A1"],["hungry","голодный","хангри","I am hungry.","A1"],["happy","счастливый","хэпи","She is happy.","A1"],["ready","готовый","рэди","Are you ready?","A1"],["next","следующий","нэкст","See you next week.","A1"],["need","нуждаться","нид","I need help.","A1"],["notice","замечать","ноутис","Did you notice that?","A2"],["instead","вместо этого","инстэд","Let's walk instead.","A2"],["count on","рассчитывать на","каунт он","You can count on me.","A2"],["almost","почти","олмоуст","I am almost ready.","A2"],["make sure","убедиться","мэйк шуэ","Make sure the door is closed.","A2"],["no matter","неважно","ноу мэтэ","No matter what happens.","A2"],["mess up","испортить","мэс ап","Don't mess up the project.","A2"],["probably","вероятно","пробэбли","She will probably come.","A2"],["might","возможно; мог бы","майт","It might rain.","A2"],["change","менять","чейндж","I want to change this.","A2"],["prepare","готовить(ся)","припэа","I prepare for my lesson.","A2"],["disappear","исчезать","дисэпиа","The cat disappeared.","A2"],["appear","появляться","эпиа","A bird appeared.","A2"],["heal","заживать","хил","The cut will heal.","A2"],["sincere","искренний","синсиэ","She gave a sincere answer.","A2"],["patient","терпеливый; пациент","пэйшэнт","Please be patient.","A2"],["whole","целый","хоул","I waited the whole day.","A2"],["feed","кормить","фид","I feed my dog.","A2"],["remind","напоминать","римайнд","Remind me tomorrow.","A2"],["believe","верить","билив","I believe you.","A2"],["take care","заботиться","тэйк кэа","Take care of yourself.","A2"],["provide","предоставлять","провайд","They provide food.","A2"],["meanwhile","тем временем","минвайл","Meanwhile, I cooked dinner.","A2"],["praise","хвалить","прэйз","She praised my work.","A2"],["clay","глина","клэй","The statue is made of clay.","A2"],["pass","проходить","пас","Three days passed.","A2"],["longing","тоска; сильное желание","лонгинг","She felt longing for home.","A2"],["bless","благословлять","блэс","She blessed the children.","A2"],["curse","проклинать","кёс","He cursed the day.","A2"],["leaf","лист","лиф","This leaf is yellow.","A2"],["leaves","листья","ливз","These leaves are green.","A2"],["by noon","к полудню","бай нун","I will finish by noon.","A2"],["deadline","крайний срок","дэдлайн","Can you meet the deadline?","A2"],["feedback","обратная связь","фидбэк","I received feedback.","A2"],["progress","прогресс","проугрэс","Show me your progress.","A2"],["clarification","уточнение","клэрифэкейшн","Do you need clarification?","A2"],["submit","отправить; сдать","сабмит","I will submit the file.","A2"],["improve","улучшать","импрув","I want to improve my English.","A2"],["receive","получать","рисив","I received a message.","A2"],["choose","выбирать","чуз","Choose a word.","A2"]];const safe=(key,def)=>{try{return JSON.parse(localStorage.getItem(key))??def}catch{return def}};let custom=safe('little-custom',[]),progress=safe('little-progress',{}),index=0,deck=[],revealed=false;const el=id=>document.getElementById(id);function save(){localStorage.setItem('little-custom',JSON.stringify(custom));localStorage.setItem('little-progress',JSON.stringify(progress))}function all(){return base.concat(custom)}function build(){const l=el('level').value,m=el('mode').value;deck=all().filter(w=>(l==='all'||(l==='saved'?w[4]==='mine':w[4]===l))&&(m!=='review'||!progress[w[0]]||progress[w[0]].next<=Date.now()));index=0;render()}function render(){const w=deck[index];revealed=false;el('hiddenPart').classList.add('hidden');el('hint').classList.remove('hidden');el('show').textContent='Показать перевод';el('status').textContent=deck.length?'Карточка '+(index+1)+' из '+deck.length+' · Выучено: '+Object.values(progress).filter(x=>x.streak>=2).length:'Нет карточек в этой категории';for(const id of ['repeat','know','speak','show'])el(id).disabled=!w;el('word').textContent=w?w[0]:'Пока всё! ✨';el('wordLevel').textContent=w?(w[4]==='mine'?'Моё слово':w[4]):'';if(w){el('pronunciation').textContent=w[2]?'['+w[2]+']':'';el('meaning').textContent=w[1];el('example').textContent=w[3]||''}}function flip(){if(!deck.length)return;revealed=!revealed;el('hiddenPart').classList.toggle('hidden',!revealed);el('hint').classList.toggle('hidden',revealed);el('show').textContent=revealed?'Скрыть перевод':'Показать перевод'}function advance(known){const w=deck[index];if(!w)return;const p=progress[w[0]]||{streak:0};p.streak=known?p.streak+1:0;const days=known?[0,1,3,7,14,30][Math.min(p.streak,5)]:0;p.next=Date.now()+ (known?days*86400000+(days===0?3600000:0):0);progress[w[0]]=p;save();if(el('mode').value==='review'){deck.splice(index,1);if(index>=deck.length)index=0}else{index=(index+1)%deck.length}render()}el('card').onclick=flip;el('card').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};el('show').onclick=flip;el('repeat').onclick=()=>advance(false);el('know').onclick=()=>advance(true);el('speak').onclick=()=>{if(!deck.length||!('speechSynthesis'in window))return;const u=new SpeechSynthesisUtterance(deck[index][0]);u.lang='en-GB';u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)};el('level').onchange=build;el('mode').onchange=build;el('shuffle').onclick=()=>{deck.sort(()=>Math.random()-.5);index=0;render()};el('add').onsubmit=e=>{e.preventDefault();const w=[el('newWord').value.trim(),el('newMeaning').value.trim(),el('newPronunciation').value.trim(),el('newExample').value.trim(),'mine'];if(!w[0]||!w[1])return;custom.push(w);save();e.target.reset();el('level').value='saved';el('mode').value='all';build();el('result').textContent='Карточка добавлена ✓'};build();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
